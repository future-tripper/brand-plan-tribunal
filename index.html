<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Brand Plan Tribunal</title>
<style>
  :root{
    --floor:#3D3028; --floor-l:#4A3B30; --floor-d:#342A22;
    --wall:#4A3D35; --wall-l:#564840; --baseboard:#2A231E;
    --warm-white:#F5F2EB; --gold:#F0B860; --amber:#E8C07D;
    --neon:#E8A0BF; --teal:#7DC4C0; --blue:#5B8BD4; --green:#7BC47D; --lav:#A890C8;
    --ink:#1A1714;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --book: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#0a0705; color:var(--warm-white); font-family:var(--mono); overflow:hidden; }
  /* feather the stage edges into the dark surround so wide screens read as a framed scene */
  #vignette{ position:absolute; inset:0; z-index:10; pointer-events:none;
    box-shadow:inset 0 0 110px 34px #0a0705; }
  body{ display:flex; align-items:center; justify-content:center; }
  body.still *{ transition:none !important; animation:none !important; }
  #stage{ position:relative; width:1280px; height:800px; flex:none; transform-origin:center center; }
  /* rotate hint for portrait phones */
  #rotate{ position:fixed; inset:0; z-index:200; display:none; background:#0a0705; color:#f3ead9;
    flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:10vw;
    font-family:var(--book); font-style:italic; font-size:5vw; }
  #rotate .rot{ font-size:13vw; animation:rotspin 2.4s ease-in-out infinite; }
  @keyframes rotspin{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(78deg)}}
  @media (max-aspect-ratio:1/1) and (max-width:820px){ #rotate{display:flex;} }

  /* ROOM */
  .room{ position:absolute; inset:0 0 132px 0; overflow:hidden;
    background:linear-gradient(180deg, var(--wall-l) 0%, var(--wall) 58%, var(--wall) 60%,
      var(--baseboard) 60%, var(--baseboard) 63%, var(--floor-d) 63%, var(--floor) 100%); }
  .room::after{ content:""; position:absolute; left:0; right:0; top:63%; bottom:0;
    background:repeating-linear-gradient(180deg, var(--floor) 0 14px, var(--floor-l) 14px 16px, var(--floor) 16px 30px, var(--floor-d) 30px 32px);
    opacity:.55; }
  #dim{ position:absolute; inset:0; background:#0a0705; opacity:.72; transition:opacity 1.2s ease; z-index:30; pointer-events:none; }
  #dim.lift{ opacity:0; }

  /* soft sunset warmth on the back wall (replaces the window) */
  .sunsetglow{ position:absolute; top:-12%; left:50%; transform:translateX(-50%); width:760px; height:340px;
    pointer-events:none; opacity:.5;
    background:radial-gradient(ellipse at 50% 30%, rgba(240,136,56,.35) 0%, rgba(196,85,128,.18) 38%, transparent 68%); }

  /* pinned plan poster */
  #plan{ position:absolute; top:8%; right:5%; width:206px; background:#efe9da; color:#241a14;
    padding:12px 14px; transform:rotate(-2deg); opacity:0; transition:opacity .6s ease;
    box-shadow:0 10px 24px rgba(0,0,0,.5); border:1px solid #c9c0ad; font-size:11.5px; line-height:1.5; z-index:6; }
  #plan.up{ opacity:1; }
  #plan h4{ font-size:13px; letter-spacing:1px; text-transform:uppercase; color:#8B3D3D; margin-bottom:6px; }
  #plan .pin{ position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:10px; height:10px;
    background:#C45580; border-radius:50%; box-shadow:0 2px 3px rgba(0,0,0,.4);}
  #plan .xx{ color:#fff; background:#C45580; padding:0 4px; font-weight:700; animation:pulse 1.6s infinite; }
  @keyframes pulse{50%{background:#7B5EA7}}

  .plant{ position:absolute; bottom:224px; left:3%; width:50px; height:92px; }
  .plant .pot{ position:absolute; bottom:0; left:8px; width:34px; height:30px; background:#C47040; border-bottom:5px solid #8B3D3D;}
  .plant .leaf{ position:absolute; bottom:26px; left:50%; width:36px; height:42px; transform:translateX(-50%);
    background:radial-gradient(circle at 50% 100%, #7BC47D 0 60%, #3D6B3D 61% 100%);
    clip-path:polygon(50% 0,72% 30%,100% 40%,76% 60%,86% 100%,50% 78%,14% 100%,24% 60%,0 40%,28% 30%);}

  /* stations + actors */
  .desk{ position:absolute; bottom:240px; width:120px; height:44px; transform:translateX(-50%);
    background:linear-gradient(180deg,#5A4D42,#3D3028); border:3px solid var(--ink); border-radius:4px;
    box-shadow:0 10px 22px rgba(0,0,0,.4); opacity:0; transition:opacity .5s ease; }
  .desk.show{ opacity:1; }
  .actor{ position:absolute; bottom:266px; transform:translateX(-50%) translateY(8px);
    image-rendering:pixelated; filter:drop-shadow(0 5px 0 rgba(0,0,0,.25));
    opacity:0; transition:opacity .55s ease, transform .55s cubic-bezier(.2,1.3,.4,1); }
  .actor.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .actor.speaking{ animation:bob 1.1s ease-in-out infinite; }
  .actor.addressed{ filter:drop-shadow(0 5px 0 rgba(0,0,0,.25)) drop-shadow(0 0 10px rgba(232,192,125,.9)); }
  .actor.gone{ opacity:.0; filter:drop-shadow(0 5px 0 rgba(0,0,0,.25)) grayscale(1); }
  @keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}

  /* staged peer message */
  .msgbub{ position:absolute; top:236px; transform:translateX(-50%) scale(.9);
    width:380px; background:#1b1510; border:2px solid #4A3D35; border-left-width:5px; border-radius:12px;
    padding:11px 14px; opacity:0; box-shadow:0 14px 34px rgba(0,0,0,.5); z-index:26;
    transition:opacity .4s ease, transform .4s cubic-bezier(.2,1.4,.4,1); }
  .msgbub.show{ opacity:1; transform:translateX(-50%) scale(1); }
  .msgbub .mwho{ font-size:11.5px; letter-spacing:.4px; font-weight:800; margin-bottom:5px; color:#cfc4b4; }
  .msgbub .mreply{ display:none; font-size:11.5px; line-height:1.35; color:#9a8f80; font-style:italic;
    border-left:2px solid #4A3D35; padding:3px 0 3px 9px; margin-bottom:8px; text-wrap:pretty; }
  .msgbub .mtext{ font-size:14px; line-height:1.45; color:#efe7d8; text-wrap:pretty; }
  .msgbub .mdead{ display:none; margin-top:7px; font-size:11px; font-style:italic; color:#8a7f73; }
  .msgbub .mtail{ position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); width:0; height:0;
    border:9px solid transparent; border-top-color:#1b1510; }
  .msgbub.poet{ border-left-color:var(--lav); } .msgbub.poet .mwho{ color:var(--lav); }
  .msgbub.mlr{ border-left-color:var(--blue); } .msgbub.mlr .mwho{ color:var(--blue); }
  .msgbub.arch{ border-left-color:var(--teal); } .msgbub.arch .mwho{ color:var(--teal); }
  .msgbub.pt{ border-left-color:var(--green); } .msgbub.pt .mwho{ color:var(--green); }
  .msgbub.sms{ border-left-color:var(--neon); } .msgbub.sms .mwho{ color:var(--neon); }

  /* character intro nametags (over each head) */
  .nametag{ position:absolute; bottom:442px; transform:translateX(-50%) translateY(8px); width:178px;
    background:#1b1510; border:1px solid #4A3D35; border-top-width:4px; border-radius:9px; padding:8px 10px;
    text-align:center; opacity:0; z-index:24; box-shadow:0 10px 24px rgba(0,0,0,.45);
    transition:opacity .45s ease, transform .45s cubic-bezier(.2,1.3,.4,1); }
  .nametag.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .nametag b{ display:block; font-size:11.5px; letter-spacing:.5px; font-weight:800; margin-bottom:4px; }
  .nametag span{ display:block; font-size:11px; line-height:1.38; color:#cfc4b4; text-wrap:pretty; }
  .nametag .nt{ position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); width:0; height:0;
    border:9px solid transparent; border-top-color:#1b1510; }
  .nametag.poet{ border-top-color:var(--lav); } .nametag.poet b{ color:var(--lav); }
  .nametag.archivist{ border-top-color:var(--teal); } .nametag.archivist b{ color:var(--teal); }
  .nametag.revenant{ border-top-color:var(--blue); } .nametag.revenant b{ color:var(--blue); }
  .nametag.patient{ border-top-color:var(--green); } .nametag.patient b{ color:var(--green); }

  /* NEON */
  .neon{ position:absolute; top:18px; left:22px; padding:9px 13px; border:3px solid #5a2f43; border-radius:8px;
    background:rgba(20,12,16,.55); line-height:1.05; z-index:40; }
  .neon b{ display:block; font-weight:800; letter-spacing:3px; color:#ffd9e8;
    text-shadow:0 0 1px #fff, 0 0 5px rgba(232,160,191,.6); font-size:20px;
    animation:flick 5s infinite steps(1); }
  .neon b.small{ font-size:15px; letter-spacing:6px; }
  .neon .tag{ font-size:9px; letter-spacing:2px; color:#8A8080; margin-bottom:3px; }
  @keyframes flick{0%,96%,100%{opacity:1}96.5%{opacity:.3}97%{opacity:1}98.4%{opacity:.55}98.8%{opacity:1}}

  /* scene label + progress */
  .scene-label{ position:absolute; top:22px; right:24px; text-align:right; z-index:40; }
  .scene-label .sn{ font-size:15px; letter-spacing:1.5px; color:var(--amber); }
  .dots{ position:absolute; top:50px; right:24px; display:flex; gap:6px; z-index:40; }
  .dots i{ width:8px; height:8px; border-radius:50%; background:#564840; display:block; }
  .dots i.on{ background:var(--neon); box-shadow:0 0 8px var(--neon); }

  /* NARRATION (storybook voice) */
  .narr{ position:absolute; top:84px; left:50%; transform:translateX(-50%) translateY(6px);
    width:720px; text-align:center; font-family:var(--book); font-style:italic;
    font-size:19px; line-height:1.5; color:#f3ead9; background:#17110d;
    padding:14px 22px; border-radius:8px; border:1px solid rgba(232,192,125,.22);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    opacity:0; transition:opacity .6s ease, transform .6s ease; z-index:45;
    text-wrap:balance; }
  .narr.in{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* SPEECH BUBBLE (verbatim artifact) */
  .bubble{ position:absolute; top:206px; left:50%; transform:translateX(-50%) scale(.92);
    width:560px; background:var(--warm-white); color:#1d1712; border-radius:10px; padding:15px 18px;
    opacity:0; box-shadow:0 0 0 4px #1d1712, 0 22px 50px rgba(0,0,0,.5);
    transition:opacity .45s ease, transform .45s cubic-bezier(.2,1.4,.4,1); z-index:25; }
  .bubble.show{ opacity:1; transform:translateX(-50%) scale(1); }
  .bubble::after{ content:""; position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
    border:10px solid transparent; border-top-color:var(--warm-white); filter:drop-shadow(0 4px 0 #1d1712); }
  .bubble .who{ font-size:14px; letter-spacing:1.2px; text-transform:uppercase; font-weight:800; margin-bottom:10px; }
  .bubble.poet .who{color:#7B5EA7;} .bubble.arch .who{color:#3f8a86;}
  .bubble.mlr .who{color:#3a5f96;} .bubble.pt .who{color:#3f7a44;}
  .bubble .body{ font-size:14.5px; line-height:1.55; white-space:pre-line; text-wrap:pretty; }
  .bubble .body .q{ color:#6a3fb0; font-weight:700; }
  .bubble.mlr .body .q{ color:#b0402a; }
  .bubble .div{ display:block; height:1px; background:#ddd5c4; margin:9px 0; }
  .readfull{ display:none; margin-top:12px; font-family:var(--mono); font-size:12.5px; font-weight:700;
    color:#6a3fb0; background:transparent; border:1px solid rgba(106,63,176,.45); border-radius:6px;
    padding:6px 11px; cursor:pointer; letter-spacing:.5px; }
  .readfull:hover{ background:rgba(106,63,176,.08); }
  .bubble.mlr .readfull{ color:#b0402a; border-color:rgba(176,64,42,.45); }
  .bubble.arch .readfull{ color:#3f8a86; border-color:rgba(63,138,134,.45); }
  .bubble.pt .readfull{ color:#3f7a44; border-color:rgba(63,122,68,.45); }
  /* full-critique modal */
  .critmodal{ position:absolute; inset:0; background:rgba(8,5,4,.9); z-index:80; display:none;
    align-items:center; justify-content:center; padding:40px 60px; }
  .critmodal.show{ display:flex; }
  .critbox{ background:#15110e; border:2px solid #4A3D35; border-radius:10px; width:820px;
    max-height:680px; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .crithead{ display:flex; justify-content:space-between; align-items:center; padding:13px 18px;
    border-bottom:1px solid #2A231E; }
  .crithead #crittitle{ font-family:var(--mono); font-size:14px; letter-spacing:1px; font-weight:800; color:var(--amber); }
  .crithead button{ font-family:var(--mono); font-size:12px; color:var(--warm-white); background:transparent;
    border:1px solid #564840; border-radius:5px; padding:5px 10px; cursor:pointer; }
  .critbody{ overflow:auto; padding:16px 22px; font-family:var(--mono); font-size:13px; line-height:1.62;
    color:#e8dcc8; white-space:pre-wrap; }

  /* FEED */
  .feed{ position:absolute; left:0; right:0; bottom:0; height:222px; background:#100d0a;
    border-top:2px solid #2A231E; padding:9px 16px; font-size:13px; overflow:hidden; z-index:40; }
  .feed .status{ color:var(--green); font-size:12.5px; letter-spacing:1px; margin-bottom:5px; }
  .feed #feedlines{ display:flex; flex-direction:column; justify-content:flex-end; height:180px; overflow:hidden; }
  .feed .ln{ color:#cfc4b4; line-height:1.55; text-wrap:pretty; }
  .feed .ln.fresh{ animation:fade .35s ease; }
  @keyframes fade{from{opacity:0;transform:translateY(4px)}}
  .feed .ln .poet{color:var(--lav);} .feed .ln .mlr{color:var(--blue);}
  .feed .ln .arch{color:var(--teal);} .feed .ln .pt{color:var(--green);} .feed .ln .sms{color:#E8A0BF;}
  .feed .ln.dead{ color:#9a8f84; } .feed .ln .dim{ color:#5A5250; font-style:italic; }

  /* FINALE */
  .finale-card{ position:absolute; top:34%; left:50%; transform:translateX(-50%); width:620px;
    text-align:center; font-family:var(--book); font-style:italic; font-size:22px; line-height:1.5; color:#f3ead9;
    opacity:0; transition:opacity 1s ease; z-index:36; text-wrap:balance; }
  /* CODA — after the play */
  .coda{ position:absolute; inset:0; background:#0a0705; z-index:60; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:72px 100px 168px; }
  .coda.show{ display:flex; }
  .coda p{ max-width:600px; margin:0; font-family:var(--book); font-size:20px; line-height:1.55;
    color:#f3ead9; text-align:center; text-wrap:balance; }
  .coda p.fresh{ animation:fade .55s ease; }
  .coda::before{ content:"AFTER THE PLAY"; position:absolute; top:72px; left:50%; transform:translateX(-50%);
    font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--neon); opacity:.7; }
  .finale-card.in{ opacity:1; }
  .finale-big{ position:absolute; top:56%; left:50%; transform:translateX(-50%); width:560px;
    text-align:center; text-wrap:balance; font-size:17px; letter-spacing:.5px;
    color:var(--neon); text-shadow:0 0 10px rgba(232,160,191,.5); opacity:0; transition:opacity 1.2s ease 1s; z-index:36; }
  .finale-big.in{ opacity:1; }

  /* CHROME */
  .nav{ position:absolute; bottom:238px; right:24px; display:flex; gap:10px; z-index:70; }
  .btn{ font-family:var(--mono); font-size:13px; letter-spacing:1px; color:#1d1712; background:var(--amber);
    border:3px solid #1d1712; border-radius:6px; padding:8px 14px; cursor:pointer; font-weight:800; box-shadow:0 4px 0 #1d1712;}
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #1d1712; }
  .btn.ghost{ background:transparent; color:var(--warm-white); border-color:#564840; box-shadow:0 4px 0 #2A231E;}
  .btn[disabled]{ opacity:.4; cursor:default; }
  .hint{ position:absolute; bottom:240px; left:50%; transform:translateX(-50%); font-size:11px; color:#6b6258; z-index:70;}
</style>
</head>
<body>
<div id="rotate"><div class="rot">📱</div><div>Rotate your phone<br>for the best view</div></div>
<div id="stage">
  <div class="room">
    <div class="sunsetglow"></div>
    <div id="plan"><span class="pin"></span><h4>VANTREXA — FY26</h4>
      Vision · 6 strategic imperatives · positioning statement<br>
      Remission at Wk 52: <span class="xx">[XX]%</span></div>
    <div class="plant"><div class="leaf"></div><div class="pot"></div></div>
    <div id="actors"></div>
    <div id="dim"></div>
  </div>
  <div id="vignette"></div>

  <div class="neon"><div class="tag">[ NOW PLAYING ]</div><b>BRAND PLAN</b><b class="small">TRIBUNAL</b></div>
  <div class="scene-label"><div class="sn" id="sn">Prologue</div></div>
  <div class="dots" id="dots"></div>

  <div class="narr" id="narr"></div>
  <div class="bubble" id="bubble"><div class="who" id="bwho"></div><div class="body" id="bbody"></div>
    <button class="readfull" id="readfull">▸ read the full critique</button></div>
  <div class="msgbub" id="msgbub"><div class="mwho" id="mwho"></div><div class="mreply" id="mreply"></div>
    <div class="mtext" id="mtext"></div>
    <span class="mdead" id="mdead">↳ delivered to a closed mailbox</span><span class="mtail"></span></div>
  <div class="finale-card" id="fcard"></div>
  <div class="finale-big" id="fbig"></div>
  <div class="coda" id="coda"></div>
  <div class="critmodal" id="critmodal"><div class="critbox">
    <div class="crithead"><span id="crittitle"></span><button id="critclose">✕ close</button></div>
    <div class="critbody" id="critbody"></div></div></div>

  <div class="feed">
    <div class="status"><span>●</span> TRIBUNAL LIVE · 4 reviewers · peer messaging on</div>
    <div id="feedlines"></div>
  </div>

  <div class="nav"><button class="btn ghost" id="restart">↺ Restart</button><button class="btn ghost" id="back">◀ Back</button><button class="btn" id="next">Next ▶</button></div>
  <div class="hint">click Next or press →</div>
</div>

<script id="critdata" type="application/json">{"poet": "# The Court Poet's Judgment Upon the VANTREXA Brand Plan\n\n*(I am in pursuit of: the governing conceit — whether \"journey\" or \"ecosystem\" or \"partnership\" rules this document, and whether any of them were ever felt.)*\n\n---\n\n## Opening Sonnet: On the Brand Vision and Its Conceits\n\nThe Vision speaks of \"journey\" — patients walk,\nYet elsewhere \"ecosystems\" bloom and grow;\nThe metaphors do neither sing nor talk\nBut lie there dead, like leaves beneath the snow.\n\"Most trusted partner\" — partner in what trade?\nA marriage? Commerce? Fellowship of arms?\nThe image shifts before the point is made,\nAnd \"redefine what's possible\" alarms —\nFor here's the turn: a document that claims\nTo redefine must first define what stands.\nBut nothing stands. These are assembled frames\nOf phrases built by algorithmic hands.\n    The one true thing this Vision could have said:\n    \"We sell a drug. We hope it works.\" — instead.\n\n---\n\n## Judgment Upon Each Strategic Imperative\n\n### Imperative the First\n\n*\"Drive differentiated, value-based engagement to accelerate appropriate adoption of VANTREXA among priority gastroenterologists and IBD centers of excellence.\"*\n\n\"To drive\" — but what is driven? Cart or team?\nThe ox, the coach, the engine, or the stake?\nThis \"driving\" is a verb stripped of its gleam,\nA motion claimed where nothing seems to wake.\n\"Differentiated, value-based\" — these words\nStand next like strangers forced to share a room;\n\"Accelerate appropriate\" — absurds\nCompounded into meaningless perfume.\nThe payer (like some feudal lord of souls\nWho grants or bars the peasant's medicine)\nGoes unaddressed while language takes its tolls.\nWhere is the turn? Where does the thought begin?\n    Six modifiers seek a noun in vain:\n    The sentence moves, but nothing's been made plain.\n\n### Imperative the Second\n\n*\"Reframe the moderate-to-severe treatment paradigm by positioning VANTREXA as the confident next step beyond advanced-therapy cycling.\"*\n\n\"Reframe the paradigm\" — what frame was there?\nA window through which nothing could be seen?\nNow \"confident\" describes a step — but where\nDoes confidence reside? What does it mean\nFor stairs to have assurance? Steps don't feel.\nThe \"cycling\" speaks of patients turned away\nFrom therapy to therapy — the wheel\nThat never stops. Yet here no wheel holds sway;\nThe metaphor appears and then departs.\n\"Beyond\" suggests a destination point,\nBut cycling has no end — it merely starts\nAgain. The logic comes apart at joint.\n    This line lacks volta: turn it as you might,\n    It stays flat on the page and sheds no light.\n\n### Imperative the Third\n\n*\"Activate an integrated, insights-driven omnichannel ecosystem to deliver the right message to the right HCP at the right moment, at scale.\"*\n\n\"Ecosystem\" — now the forest grows!\nBut \"omnichannel\" bleeds the image white:\nWhat ecosystem has a channel? Those\nWho wrote this never held the thought in sight.\n\"Activate\" — as if the system slept\nAnd merely needed waking with a word;\n\"Insights-driven\" — by what insights kept?\nThe driver is a concept, still unheard.\n\"The right, the right, the right\" — three repetitions\nWithout a single instance specified;\nThese are not words but rhetorical positions,\nA syntax where all meaning went and died.\n    \"At scale\" — the final flourish, coda, close:\n    A scale of what? The document won't disclose.\n\n### Imperative the Fourth\n\n*\"Unlock the authentic patient voice to build enduring trust and deepen engagement across the UC community.\"*\n\n\"Unlock\" — what lock? Who holds the patient mute?\nThe corporation? Shame? The FDA?\nAnd if the voice be locked, what iron brute\nHas sealed it, that we need to pry away?\n\"Authentic\" placed beside \"unlock\" implies\nThe voice is there but hidden, under guard —\nA curious position when one tries\nTo speak of patients. Why is access barred?\nPerhaps the lock is in the asking: we\nWho write of \"activating\" patient \"voice\"\nHave caged it in our language. Can it be\nThat patients speak, but marketing made choice\n    To hear them only when it serves the brand?\n    \"Enduring trust\" rings hollow in this land.\n\n### Imperative the Fifth\n\n*\"Win the first-line biologic conversation in moderate-to-severe UC.\"*\n\n\"Win the conversation\" — warfare now!\nThe battlefield is discourse, weapons: words.\nBut conversations have no win; they bow\nTo neither side, like undefeated birds.\nOne wins a match, a battle, or a case;\nConversations end, or shift, or fade —\nTo \"win\" one is to fail to hold the space\nWhere speaking happens. Talking isn't trade.\nAnd yet the NBRx (I know not what\nThis cipher means, some count of scripted scrolls)\nSuggests the \"winning\" is a number got.\nIf so, why speak of conversation's tolls?\n    The metaphor of combat ill befits\n    A line that claims to care. It contradicts.\n\n### Imperative the Sixth\n\n*\"Ensure cross-functional, synergistic launch readiness for flawless in-market execution.\"*\n\n\"Cross-functional\" — I picture men who leap\nFrom function unto function in the night;\n\"Synergistic\" — energies that seep\nTogether, though the source stays out of sight.\n\"Launch readiness\" — a ship? A weapon? Craft?\nWhat launches? \"Flawless\" — as if plans don't fail,\nAs if the word itself could seal the raft\nAgainst the storms that make all launches pale.\n\"In-market execution\" — here the end:\nExecution of whom? The patient? Staff?\nThe language of the scaffold starts to blend\nWith language of the sale. One wants to laugh.\n    No turn, no volta, no concession made:\n    The line asserts perfection, undismayed.\n\n---\n\n## Judgment Upon the Positioning Statement\n\n*\"For appropriate adult patients with moderate-to-severe ulcerative colitis who continue to struggle despite currently available therapies, VANTREXA® (mirzelantide) is the once-monthly biologic that delivers confident, lasting control of the symptoms that disrupt daily life — so patients can get back to the moments that matter most.\"*\n\n\"The moments that matter most\" — which ones? A child's\nFirst steps? A wedding? Tuesday morning's bread?\nThe phrase gestures toward life but reconciles\nWith nothing real. The specificity is dead.\n\"Confident control\" — again the drug has moods,\nAs if the molecule could feel assured;\nThe patient's confidence gets misconstrued\nAs property the compound has secured.\n\"Continue to struggle\" — struggle does what work?\nIt animates the patient as one who fights,\nYet \"appropriate\" before it like a quirk\nSuggests some patients lack these struggling rights.\n\n---\n\n## The Couplet of Reckoning\n\n    Where twenty metaphors are called to serve,\n    Not one remains with sinew, bone, or nerve.\n\n---\n\n*Signed this day by one who reads as he was taught:*\n*The line must turn, or it has said for naught.*\n\n— **The Court Poet**", "archivist": "# NAR-PH-2026-VANTR-v9\n## North American Repository for Material Culture\n### Catalogue Entry: VANTREXA FY26 Brand Planning Document\n### Accession Date: 2200-06-02 | Annotating Archivist: Sr. Archivist T. Voss, Dept. of Extinct Commercial Cultures\n\n---\n\n## EXHIBIT LABEL: POSITIONING STATEMENT\n\n**[NAR-PH-2026-VANTR-v9-FIND-001]**\n\nThe recovered document appears to have served as a ritual declaration of purpose for a pharmaceutical product-entity designated VANTREXA. The statement addressed what the planners called \"appropriate adult patients\" — a phrase whose qualifier \"appropriate\" suggests not all adults were considered eligible for salvation; some screening or worthiness determination preceded access. The disease in question, \"moderate-to-severe ulcerative colitis,\" was apparently a condition of the large intestine, though its cultural significance extended far beyond the physical: sufferers were described as people who could not return to \"the moments that matter most,\" a poignant formulation suggesting the illness had severed them from time itself — specifically, from a privileged category of time distinct from the moments that matter least.\n\nThe product-entity VANTREXA (mirzelantide) was administered once monthly, a dosing interval the planners described as \"designed to fit patients' lives.\" This language implies that prior therapies had been designed to fit something else — perhaps the lives of the organ-sign readers (gastroenterologists), or the feudal payers, or the document itself.\n\nOf particular note is the suffix designation TogetherCare™, appended to what appears to have been a support apparatus. The trademark symbol (™) indicates the concept of togetherness was, at this time, a proprietary asset.\n\n---\n\n## LITURGICAL FORMULAE — COLLECTION PREVALENCE ANALYSIS\n\n**[NAR-PH-2026-VANTR-v9-FIND-002]**\n\nThe document contained the following formulae, each of which the Repository has encountered across multiple specimens in the Pharmaceutical Brand Plan sub-collection (estimated 2,400 documents, circa 2010–2140 CE):\n\n**Formula I: \"Reframe the [noun] paradigm\"**\n*Occurrence in this document: Strategic Imperative 2 (\"Reframe the moderate-to-severe treatment paradigm\")*\nThe planners appear to have believed the cosmological order governing their market could be manually rotated, like a lens. Collection prevalence: 87%. No document in this collection contains evidence that the paradigm was successfully reframed. Whether this is because reframing was impossible, or because successful reframings destroyed the documents themselves, remains an open research question.\n\n**Formula II: \"At scale\"**\n*Occurrence in this document: Strategic Imperative 3 (\"deliver the right message to the right HCP at the right moment, at scale\")*\nThe phrase appeared at the end of the passage, suggesting it functioned as a benediction rather than a specification. Collection prevalence: 91%. In no recovered document has \"scale\" been given a numerical value. The Repository's working hypothesis is that scale was an eschatological concept: a future state of magnitude that, once achieved, would require no further elaboration.\n\n**Formula III: \"Synergistic [noun] readiness\"**\n*Occurrence in this document: Strategic Imperative 6 (\"cross-functional, synergistic launch readiness\")*\n\"Synergistic\" appears here in conjunction with \"cross-functional,\" another term with no surviving referent. The pairing of two liturgical terms in a single phrase suggests this imperative was understood less as an operational directive and more as a closing invocation — the ritual seal of a launch. Collection prevalence: 94%. No document has been recovered that defines what a non-synergistic launch would have looked like, which suggests the term's function was protective rather than descriptive.\n\n---\n\n## CONSPICUOUS ABSENCE ENTRY\n\n**[NAR-PH-2026-VANTR-v9-FIND-003]**\n\nThe positioning statement and all six strategic imperatives contain no reference to a person experiencing the illness described. The document names \"patients\" forty-seven times across recovered materials, but in each instance the patient appears as an object acted upon — a target of engagement, a voice to be \"unlocked,\" a community to be trusted. The single sentence that approaches interiority — \"patients can get back to the moments that matter most\" — describes not the patient's experience but the promised terminus of their compliance.\n\nMore notable still: the payer, identified in the Repository's translation glossary as a feudal administrator controlling medicine access, is entirely absent from this document despite being, by all archaeological evidence, the dominant force in determining whether any patient received any treatment at all. The planners appear to have drafted a six-point strategic framework without mentioning the entity that could nullify all six points with a single formulaic denial. Whether this omission reflects optimism, avoidance, or a separate classified document that has not survived is unknown.\n\n---\n\n## CATALOGUE ENTRIES: SIX STRATEGIC IMPERATIVES\n\n**[NAR-PH-2026-VANTR-v9-FIND-004]**\n*Strategic Imperative 1: \"Drive differentiated, value-based engagement to accelerate appropriate adoption of VANTREXA among priority gastroenterologists and IBD centers of excellence.\"*\n\nThis imperative appears to have established a target population not of patients, but of organ-sign readers (gastroenterologists) and their institutional affiliates, designated \"IBD centers of excellence.\" The phrase \"centers of excellence\" suggests a hierarchy among such centers, with inferior centers presumably existing in some quantity but not mentioned. The word \"appropriate\" appears a second time, reinforcing the document's recurring concern with fitness — who was appropriate, what adoption was appropriate, what scale was appropriate. The planners were, in this archivist's assessment, deeply anxious about inappropriateness. Whether this anxiety was clinical, legal, or cosmological has not been determined.\n\n**[NAR-PH-2026-VANTR-v9-FIND-005]**\n*Strategic Imperative 2: \"Reframe the moderate-to-severe treatment paradigm by positioning VANTREXA as the confident next step beyond advanced-therapy cycling.\"*\n\nThe phrase \"advanced-therapy cycling\" appears to describe a prior state of treatment in which patients moved between therapies without resolution — a kind of medicinal purgatory. VANTREXA was to serve as egress from this cycle. The descriptor \"confident\" is unusual here: it was attributed not to the patient, nor to the organ-sign reader, but to the step itself. The step had confidence. The Repository notes this as an early instance of what later scholars have called pharmaceutical animism — the attribution of psychological states to treatment protocols. Collection note: this is the only one of the six imperatives to invoke the cosmological paradigm directly. Its placement as Imperative 2, rather than 1, may indicate the planners wished to establish an audience before announcing their cosmological ambitions.\n\n**[NAR-PH-2026-VANTR-v9-FIND-006]**\n*Strategic Imperative 3: \"Activate an integrated, insights-driven omnichannel ecosystem to deliver the right message to the right HCP at the right moment, at scale.\"*\n\nThis imperative is the document's fullest expression of the theological concept \"omnichannel.\" The brand-entity was to be activated — a word of considerable force, suggesting dormancy preceding divine awakening — and thereafter to deliver the correct message, to the correct healer, at the correct moment. The triple repetition of \"right\" (right message, right HCP, right moment) functions as an incantation of precision. This archivist observes that precision, once stated three times, was apparently sufficient: the document does not specify how the correct moment would be recognized, nor what would happen if the correct message arrived at the wrong moment. At scale is appended as benediction. See Formula II note above.\n\n**[NAR-PH-2026-VANTR-v9-FIND-007]**\n*Strategic Imperative 4: \"Unlock the authentic patient voice to build enduring trust and deepen engagement across the UC community.\"*\n\nThis imperative introduces the concept of the \"authentic patient voice,\" which the planners described as something to be unlocked. The metaphor of unlocking implies the voice was, prior to this imperative, locked — by whom or by what mechanism the document does not say. Once unlocked, the voice was to \"build enduring trust,\" a formulation that raises a question of directionality: trust between whom? Between patients and the brand-entity? Between patients and their organ-sign readers? Between the brand-entity and itself? The \"UC community\" is named here as a collective, suggesting patients with this condition had organized themselves into a social unit — a remarkable development that the document references without further comment, as though communities of the afflicted were a standard feature of the landscape.\n\n**[NAR-PH-2026-VANTR-v9-FIND-008]**\n*Strategic Imperative 5: \"Win the first-line biologic conversation in moderate-to-severe UC.\"*\n\nThis is the most compressed of the six imperatives and, the Repository submits, the most candid. The planners sought to \"win\" a \"conversation\" — the competitive metaphor dropped without ritual softening. Unlike the other five imperatives, no qualifying adjective precedes this directive: no \"differentiated,\" no \"integrated,\" no \"authentic,\" no \"synergistic.\" The imperative simply declares victory as the goal. The \"first-line biologic conversation\" appears to describe a deliberation, conducted between organ-sign readers and patients, about which medicine to try first. That this deliberation was called a \"conversation\" and not a \"decision\" suggests the planners understood the moment to be dialogic — multiple parties, negotiable, susceptible to influence. This imperative appears to be the document's honest statement. It was placed fifth, after the cosmological claims and the theological infrastructure, where it would not startle the reader.\n\n**[NAR-PH-2026-VANTR-v9-FIND-009]**\n*Strategic Imperative 6: \"Ensure cross-functional, synergistic launch readiness for flawless in-market execution.\"*\n\nThe final imperative describes what the planners called \"flawless in-market execution\" — a condition of zero error that this archivist has never encountered as a documented outcome in any recovered pharmaceutical artifact. The imperative does not contemplate partial readiness, approximate synergy, or execution of the merely competent variety. The modifier \"flawless\" suggests the planners believed perfection was an achievable operational state rather than an aspirational one. \"Cross-functional\" appears here without definition; the functions in question are unknown. The Repository's working hypothesis is that \"cross-functional synergistic launch readiness\" described the desired psychological state of the planning group on the day preceding launch — a state of collective certainty that all would proceed as imagined. Whether it ever did remains, as with most claims in this collection, undocumented.\n\n---\n\n## CENTRAL ANTHROPOLOGICAL QUESTION\n\n**[NAR-PH-2026-VANTR-v9-FIND-010]**\n\nAcross all six imperatives and the positioning statement, the planners described a world in which the correct message, delivered at the correct moment, through the correct channels, to the correct healers, in a sufficiently synergistic manner, would produce the correct outcome. The document does not once acknowledge the possibility of failure. No imperative contains a contingency. No formula admits revision.\n\nThe central question this document poses for future researchers is not commercial or clinical. It is epistemological: **did the planners believe what they wrote?**\n\nThe Repository offers no answer. The document does not survive alongside any record of the launch. Whether VANTREXA achieved first-line biologic status, whether the paradigm was reframed, whether flawless execution occurred — none of this was found with the artifact. What was found was the plan itself, complete, confident, and alone.\n\nThis is consistent with all other documents in the collection.\n\n---\n\n*Accession complete. Document transferred to Climate-Controlled Repository Wing 7, Cabinet 14, Drawer C.*\n*Cross-reference: NAR-PH-2026-ANOTH-v12 (comparable launch document, comparable formulae, comparable absence of outcome data).*\n*Archivist notation: T. Voss, Sr. Archivist, Dept. of Extinct Commercial Cultures, 2200-06-02.*", "revenant": "# mlr-revenant Critique: VANTREXA FY26 Brand Plan\n## Strategic Imperatives & Positioning Statement\n\n---\n\n⬛ BLACK BOX WARNING\n\n\"Lasting control\" in the positioning statement is undefined against any validated clinical endpoint. The phrase appears in the context of \"lasting control of the symptoms that disrupt daily life\" but provides no timeframe (12 weeks? 52 weeks? durability beyond trial?), no comparator reference, and no specification of what clinical remission means in the UC population under review (Mayo endoscopy subscore ≤1? Fecal calprotectin threshold?). This is the single most dangerous unsubstantiated claim in the positioning — it directly addresses patient outcomes but offers no evidence.\n\n---\n\n## STRATEGIC IMPERATIVES (all 6 flagged)\n\n**Imperative 1: \"Drive differentiated, value-based engagement to accelerate appropriate adoption of VANTREXA among priority gastroenterologists and IBD centers of excellence.\"**\n\n\"Differentiated\" — relative to what? Name the comparator explicitly. If this means superior to TNF inhibitors, state it. If superior to IL-23 inhibitors, state it. Current phrasing is undefined comparative claim. Cite: named competitor, specific differentiation claim, evidence type (RCT head-to-head, health economics analysis, or payer outcome data).\n\n\"Value-based engagement\" — substantiate what constitutes \"value\" for the gastroenterologist audience. Is this: efficacy per dollar? Dosing convenience? Reduced immunogenicity risk? Safety profile? Without definition, this is marketing language masquerading as a strategic principle. Cite: health economics data, payer dossier, or named clinical trial demonstrating superior value on a defined metric.\n\n---\n\n**Imperative 2: \"Reframe the moderate-to-severe treatment paradigm by positioning VANTREXA as the confident next step beyond advanced-therapy cycling.\"**\n\n\"Confident\" — not a clinical descriptor. Remove this word or operationalize it: \"supported by sustained clinical remission data\" or \"backed by Phase 3 non-inferiority margin\" are clinical. \"Confident\" is editorial tone. Cite: remove or define against a specific endpoint.\n\n\"Advanced-therapy cycling\" — undefined clinical scenario. Does this mean: patients who have failed one TNF inhibitor? Patients who have cycled through two biologics? Patients with documented treatment failure across classes? The positioning assumes a defined prior-therapy population, but does not name it. Clinical trial inclusion criteria define who qualifies; cite the trial name, phase, and specific prior-therapy requirements from the primary Phase 3 study.\n\n\"Next step\" — implies this is an escalation therapy, not first-line. Positioning is positioning-agnostic on this point. If VANTREXA is intended as first-line (per Imperative 5), this contradicts Imperative 2. Reconcile: is this a first-line claim or a salvage-therapy claim? The two cannot coexist in a single positioning without named subpopulations and evidence supporting each. Cite: trial design, population stratification if applicable.\n\n---\n\n**Imperative 3: \"Activate an integrated, insights-driven omnichannel ecosystem to deliver the right message to the right HCP at the right moment, at scale.\"**\n\nThis is a distribution and execution strategy, not a brand imperative. No clinical claim detected, therefore no substantiation required for this entry per regulatory standards. Flagged as aspirational operational language without a measurable clinical outcome tied to brand positioning. If this contains an implicit efficacy or safety claim (e.g., \"at the right moment\" implies timing-dependent response), make it explicit and cite supporting evidence.\n\n---\n\n**Imperative 4: \"Unlock the authentic patient voice to build enduring trust and deepen engagement across the UC community.\"**\n\n\"Authentic patient voice\" — methodology undefined. Is this: qualitative interview data? Patient-reported outcome instrument responses? Advocacy group input? Published testimonials? Without a data source and validation method, this is aspirational language. If derived from clinical trial PRO data, cite the trial name, PRO instrument name, and specific endorsement question/response that grounds \"authenticity.\" If derived from external sources (advocacy groups, social media), state source and validation status (peer-reviewed? Explorative only?).\n\n\"Enduring trust\" — no endpoint. How is trust measured? Over what timeframe? If this is measurable via brand tracking or patient satisfaction surveys, cite methodology and baseline metrics. If it is purely aspirational, acknowledge this is positioning intent, not evidence-based claim.\n\n\"Deepen engagement\" — undefined. Engagement with what? In what form? Cite: metric definition, baseline, target.\n\n---\n\n**Imperative 5: \"Win the first-line biologic conversation in moderate-to-severe UC.\"**\n\n\"Win\" — undefined. Does this claim VANTREXA *is* appropriate as first-line biologic? Or that VANTREXA *should be in* the first-line conversation?\n\nIf first-line claim: positioning requires head-to-head RCT vs. the current standard first-line biologic. In UC, TNF inhibitors and IL-23 inhibitors are first-line; VANTREXA must be non-inferior or superior to one of these at minimum. Cite: trial name, comparator arm, primary endpoint, non-inferiority margin if applicable, P-value, absolute response difference (e.g., remission rate 65% VANTREXA vs. 62% TNF inhibitor, P=0.04).\n\nIf conversation-based claim only (VANTREXA should be discussed, not necessarily chosen): substantiate what qualifies VANTREXA for the conversation. Comparative data? Safety advantage? Cite evidence type and source.\n\nCurrent phrasing is strategically aggressive (first-line) but substantively undefined. Reconcile with Imperative 2, which positions VANTREXA as \"next step beyond advanced-therapy cycling\" (salvage context). These two imperatives describe contradictory positioning tiers. Clarify which one is the claim and cite evidence for that tier only.\n\n---\n\n**Imperative 6: \"Ensure cross-functional, synergistic launch readiness for flawless in-market execution.\"**\n\nOperational language. No clinical or regulatory substantiation required. Flagged as governance language without evidence component.\n\n---\n\n## POSITIONING STATEMENT — LINE-BY-LINE FLAGS\n\n**Line 1:** \"For appropriate adult patients with moderate-to-severe ulcerative colitis who continue to struggle despite currently available therapies\"\n\n\"Continue to struggle despite currently available therapies\" — this is a clinical description of the target population. What defines \"struggle\"? Active symptoms despite biologic use? Failed escalation across classes? Cite the Phase 3 trial inclusion criteria explicitly: primary or secondary failure on TNF inhibitor? Both TNF and IL-23 inhibitors? State the prior-therapy requirement from the trial.\n\n\"Currently available therapies\" — list them. Does this include: 5-ASA, corticosteroids, conventional immunosuppressants, TNF inhibitors, IL-23 inhibitors, JAK inhibitors, S1P modulators? If VANTREXA is positioned after failure on all categories, say so. If positioned after failure on biologics only, say so. Current phrasing is too vague and allows HCP misinterpretation of the intended population.\n\n---\n\n**Line 2:** \"VANTREXA® (mirzelantide) is the once-monthly biologic that delivers confident, lasting control of the symptoms that disrupt daily life\"\n\n\"Confident\" — remove or substantiate. Not a clinical term. Cite: clinical endpoint or remove.\n\n\"Lasting control\" — timeframe undefined. Lasting = how long? 12 weeks? 52 weeks? Lifetime? If based on trial data, cite follow-up duration. If post-hoc projection, state statistical method. Cite: trial name, primary endpoint duration, post-study follow-up data if applicable.\n\n\"Control of the symptoms that disrupt daily life\" — this is a functional/QoL claim. Cite the PRO instrument used in Phase 3 that captured this outcome (e.g., IBDQ, UC Symptom Severity Scale, patient-specific symptom questionnaire). Specify the improvement threshold that qualifies as \"control\" (e.g., IBDQ ≥170 or ≥30-point improvement from baseline).\n\n---\n\n**Line 3:** \"so patients can get back to the moments that matter most\"\n\n\"Moments that matter most\" — this is undefined patient-reported outcome language. If a validated PRO instrument measures this (e.g., specific IBDQ domain, custom functional outcome measure), name it. If aspirational language, acknowledge it is not endpoint-anchored. Cite: validated PRO instrument name OR acknowledge this is aspirational framing without PRO substantiation.\n\n---\n\n**Line 4:** \"Unlike other advanced therapies, VANTREXA is delivered through the VANTREXA TogetherCare™ patient support experience\"\n\n\"Unlike other advanced therapies\" — comparative claim without named comparator. This is the highest-risk phrasing in the positioning. State explicitly: \"Unlike TNF inhibitors, which [do not/do provide] X\" or \"Unlike IL-23 inhibitors, which require [Y], VANTREXA [Z].\"\n\nCurrent phrasing is undefined comparative and will invite HCP challenge: unlike *which* therapy on *what* dimension? Comparative claims require named competitor and named differentiation point. Cite: comparator therapy name, specific differentiator, evidence source (trial data, safety database, prescribing information).\n\n\"VANTREXA TogetherCare™ patient support experience\" — this is a brand trademark for patient support services. If the claim is that TogetherCare is *unlike* competitor support programs, cite comparative data on patient satisfaction, adherence, or clinical outcome improvement vs. comparator support programs. If no such data exists, reframe: \"offered through\" not \"unlike other advanced therapies delivered through\" — removes the comparative claim.\n\n---\n\n**Line 5:** \"reflecting our unwavering commitment to the whole patient, not just the disease\"\n\nAspirational tone language. No clinical claim detected. No substantiation required unless this references a specific clinical intervention (e.g., integrated physical therapy, mental-health screening, nutritional guidance). If such services are part of TogetherCare, name them and cite outcomes data. Otherwise, flag as brand positioning intent without evidence component.\n\n---\n\n## REASONS TO BELIEVE\n\n**Bullet 1:** \"Proven, durable efficacy: [XX]% of patients achieved clinical remission at Week 52.\"\n\n**CRITICAL PLACEHOLDER FLAG:** [XX]% is not a claim; it is a *claim slot* with no value. Populate this with a specific number or remove the sentence entirely. Do not publish positioning with placeholders.\n\nIf populated: state the following non-negotiable data.\n- Trial name and identifier (e.g., NCT04123456)\n- Trial phase (Phase 2b, Phase 3, pivotal)\n- Sample size (N=total enrolled, N=intent-to-treat population analyzed)\n- Primary endpoint definition: clinical remission per trial protocol (e.g., Mayo score ≤2 with subscores ≤1 for all three, OR Mayo endoscopy subscore ≤1 AND rectal bleeding ≤0)\n- Timepoint: Week 52 is stated; confirm this matches primary trial endpoint timing\n- Remission rate for VANTREXA arm (e.g., 65%)\n- Comparator remission rate if head-to-head trial (e.g., 45% placebo OR 62% active comparator)\n- Statistical significance: P-value and confidence interval\n- Publication status: peer-reviewed journal (cite PMID) or \"data on file\" with full trial phase/N disclosed\n\n\"Durable efficacy\" — durability is undefined. Does this mean: Week 52 remission maintained through Week 104? Maintained on continued dosing? If durability data extends beyond Week 52, cite the follow-up duration and endpoint. If Week 52 is the trial cutoff, do not claim \"durable\" without post-hoc follow-up data or mechanistic justification.\n\n---\n\n**Bullet 2:** \"Convenient once-monthly subcutaneous dosing designed to fit patients' lives.\"\n\n\"Convenient\" — undefined. If this was measured as a PRO endpoint in Phase 3 (e.g., TSQM treatment convenience domain, patient-specific preference questionnaire), cite the instrument and improvement score vs. baseline or comparator. If based on frequency comparison (monthly vs. weekly TNF inhibitor), state that comparison explicitly: \"monthly dosing vs. [comparator frequency]\" is measurable; \"designed to fit\" is not.\n\n\"Designed to fit patients' lives\" — unsubstantiated. If feasibility data exists (patient interviews, adherence outcomes), cite it. If aspirational only, acknowledge this is brand messaging not evidence claim.\n\n---\n\n## Summary of Outstanding Items\n\nSix imperatives flagged. Two contain undefined comparative claims (Imperatives 1, 2). Two contain undefined clinical positioning (Imperatives 2, 5) that contradict each other without population stratification. Positioning statement contains one critical placeholder [XX]% that must be populated before any use. Four unsubstantiated patient-outcome claims (\"lasting control,\" \"moments that matter most,\" \"confident,\" \"convenient\") require either clinical endpoint citation or reframing as aspirational messaging.\n\nThe positioning is strategically ambitious (first-line positioning + advanced-therapy positioning) without clinical evidence supporting both tiers simultaneously. Reconcile: choose the tier (first-line or salvage) and cite evidence for that tier only, or stratify the population and cite evidence for each.\n\nSelf-review: I have flagged \"undefined\" seven times without always specifying *which* regulatory standard defines the requirement. Note for next review: cite specific CFR sections (21 CFR 320.1 for UC indication requirements, 21 CFR 201.56 for comparative claims substantiation) to anchor each flag in regulatory authority rather than editorial judgment alone.\n\n---\n\n**Status:** Part 1 complete. Message to court-poet sent. Task #3 complete.", "patient": "# Tuesday Patient — Critique of VANTREXA FY26 Brand Plan\n\n---\n\n## Act I: Positioning Statement\n\n\"Appropriate adult patients who continue to struggle despite currently available therapies.\" I don't know if I'm that patient or not — I've tried three biologics but I don't know if that counts as \"appropriate.\" What does that mean for me on a Tuesday when I'm calling my GI's office?\n\n*[text to Sarah: \"they wrote a whole thing about me but I still don't know if it's for me\"]*\n\n---\n\n## Act II: Strategic Imperatives\n\n**Imperative 1: \"Drive differentiated, value-based engagement to accelerate appropriate adoption among priority gastroenterologists and IBD centers of excellence.\"**\n\nWhat does \"appropriate adoption\" mean for me on a Tuesday? My GI is not at an IBD center of excellence — she's in a regular practice in a suburb. Am I just not in the math here?\n\n---\n\n**Imperative 2: \"Reframe the moderate-to-severe treatment paradigm by positioning VANTREXA as the confident next step beyond advanced-therapy cycling.\"**\n\nIs this for me now or after everything else fails? Because those are different. I've done two that worked for a while and one that never worked — is that \"advanced-therapy cycling\" or do I need to fail one more?\n\n---\n\n**Imperative 3: \"Activate an integrated, insights-driven omnichannel ecosystem to deliver the right message to the right HCP at the right moment, at scale.\"**\n\n*I don't know what \"omnichannel ecosystem\" means.* What does that mean for me on a Tuesday?\n\n---\n\n**Imperative 4: \"Unlock the authentic patient voice to build enduring trust and deepen engagement across the UC community.\"**\n\nI am a patient voice in this room right now and nobody has asked me a question yet. \"Unlock\" sounds like I'm a resource. I'm not a resource.\n\n---\n\n**Imperative 5: \"Win the first-line biologic conversation in moderate-to-severe UC.\"**\n\nIs this for me now or after everything else fails? Because if this is first-line that changes everything — why did I go through two other biologics first, and is VANTREXA something I could have had earlier?\n\n---\n\n**Imperative 6: \"Ensure cross-functional, synergistic launch readiness for flawless in-market execution.\"**\n\n*I don't know what \"synergistic launch readiness\" means.* What does \"flawless in-market execution\" mean for me on a Tuesday when my insurance denies the prior auth?\n\n---\n\n## Act III: Grievance Document\n\nI have been sitting in this room for the full session and I still do not know if I am an appropriate patient. The plan says \"appropriate adult patients who continue to struggle despite currently available therapies\" and I have struggled for six years across three biologics, two of which worked for a while and stopped, one of which never worked, and I genuinely do not know if that makes me the patient this drug is for or not. Imperative 5 says VANTREXA wants to win the first-line conversation, and Imperative 2 says it's the confident next step beyond advanced-therapy cycling, and those are not the same thing, and nobody in this room has acknowledged that. TogetherCare™ is listed under Reasons to Believe as if support is the same category as clinical remission, and it is not. The number says [XX]% and I do not know what [XX] is. I came here because someone thought it would be useful to have a patient present. I stayed. I still don't know if I'm appropriate."}</script>

let cursor=1; // number of beats applied (>=1)
function fold(n){
  const s={label:'Prologue',nar:'',plan:false,lift:false,present:new Set(),tags:new Set(),bubble:null,msg:null,
    feed:[],fcard:'',fbig:'',coda:[]};
  for(let i=0;i<n;i++){ const b=B[i];
    if(b.sc!==undefined)s.label=b.sc;
    if(b.nar!==undefined)s.nar=b.nar;
    if(b.plan)s.plan=true;
    if(b.lift)s.lift=true;
    if(b.enter==='all')['poet','archivist','revenant','patient'].forEach(x=>s.present.add(x));
    else if(b.enter)s.present.add(b.enter);
    if(b.exit==='all')s.present.clear();
    else if(b.exit)s.present.delete(b.exit);
    if(b.tag)s.tags.add(b.tag);
    if(b.tagsoff)s.tags.clear();
    if(b.clear){s.bubble=null; s.msg=null;}
    if(b.speak)s.bubble=b.speak;
    if(b.feed)s.feed.push(b.feed);
    if(b.msg){s.msg=b.msg; s.feed.push(b.msg);}
    if(b.fcard!==undefined)s.fcard=b.fcard;
    if(b.fbig!==undefined)s.fbig=b.fbig;
    if(b.coda)s.coda.push(b.coda);
  }
  return s;
}
function feedHtml(f){

  return `${who}: ${f.text}${dead}`;
}

    el.coda.classList.add('show');
  } else { el.coda.classList.remove('show'); el.coda.innerHTML=''; }
  // nav
  el.back.disabled=cursor<=1; el.next.disabled=cursor>=B.length;
  el.next.textContent=cursor>=B.length?'Fin':'Next ▶';
  el.restart.style.display=cursor>=B.length?'inline-block':'none';
}
function next(){ if(cursor<B.length){cursor++; render(true);} }
function back(){ if(cursor>1){cursor--; render(false);} }
function restart(){ cursor=1; render(true); }
el.next.onclick=next; el.back.onclick=back; el.restart.onclick=restart;
window.addEventListener('keydown',e=>{
  if(critmodal.classList.contains('show')){ if(e.key==='Escape')closeCrit(); return; }
  if(e.key==='ArrowRight'||e.key===' ')next(); if(e.key==='ArrowLeft')back(); });

/* scale the fixed 1280x800 stage to fit any screen */
const stage=document.getElementById('stage');
function fit(){ const s=Math.min(window.innerWidth/1280, window.innerHeight/800);
  stage.style.transform=`scale(${s})`; }
window.addEventListener('resize',fit); fit();

/* tap anywhere (except controls / links / modal) advances */
stage.addEventListener('click',e=>{
  if(critmodal.classList.contains('show')) return;
  if(e.target.closest('.btn,.readfull,.nav,#critmodal,a')) return;
  next();
});

render(true);

/* still-frame capture mode: ?still disables animation, ?beat=N jumps to a beat (for video export) */
(function(){ const p=new URLSearchParams(location.search);
  if(p.has('still')) document.body.classList.add('still');
  if(p.has('beat')){ cursor=Math.max(1,Math.min(B.length,parseInt(p.get('beat'),10)||1)); render(false); }
  window.__BEATS__=B.length;
})();
</script>
</body>
</html>
